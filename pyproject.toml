[project]
name = "proyecto-ama-intent"
version = "3.2.0"
description = "Sistema de Cerebro Artificial Biomimético con gobernanza AMA-G"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "python-fasthtml",
  "ollama",
  "python-dotenv",
  "uvicorn",
  "cryptography"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.black]
line-length = 88
target-version = ["py310", "py311"]
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
